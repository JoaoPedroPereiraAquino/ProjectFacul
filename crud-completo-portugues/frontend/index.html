<!DOCTYPE html>
<html ng-app="crudApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Livros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="app.js"></script>
</head>
<body ng-controller="MainCtrl" class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white text-center">
        <h2>Gerenciador de Livros</h2>
      </div>
      <div class="card-body">
        <form ng-submit="addBook()" class="row g-3 align-items-center mb-4">
          <div class="col-sm-5">
            <input type="text" ng-model="newBook.title" class="form-control" placeholder="Título" required>
          </div>
          <div class="col-sm-5">
            <input type="text" ng-model="newBook.author" class="form-control" placeholder="Autor" required>
          </div>
          <div class="col-sm-2 text-end">
            <button type="submit" class="btn btn-success w-100">Adicionar Livro</button>
          </div>
        </form>
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead class="table-dark">
              <tr>
                <th>Título</th>
                <th>Autor</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="book in books">
                <td>
                  <span ng-hide="book.editing">{{book.title}}</span>
                  <input ng-show="book.editing" type="text" ng-model="book.title" class="form-control">
                </td>
                <td>
                  <span ng-hide="book.editing">{{book.author}}</span>
                  <input ng-show="book.editing" type="text" ng-model="book.author" class="form-control">
                </td>
                <td class="text-center">
                  <button ng-hide="book.editing" ng-click="editBook(book)" class="btn btn-sm btn-warning me-2">Editar</button>
                  <button ng-show="book.editing" ng-click="updateBook(book)" class="btn btn-sm btn-primary me-2">Salvar</button>
                  <button ng-click="deleteBook(book)" class="btn btn-sm btn-danger">Excluir</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
